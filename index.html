<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="L&amp;D Shift">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#f7f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171415" media="(prefers-color-scheme: dark)">
<title>L&amp;D Shift</title>
<script>try {
  const st = JSON.parse(localStorage.getItem('bellasbook-v1')) || {}, el = document.documentElement;
  if (st.theme === 'light' || st.theme === 'dark') el.dataset.theme = st.theme;
  if (st.textSize) el.dataset.size = st.textSize;
  if (st.font) el.dataset.font = st.font;
} catch (e) {}</script>
<style>
:root{
  --bg:#f7f4f2;--card:#ffffff;--ink:#231f20;--muted:#6f6769;--line:#e6dfdc;
  --accent:#a8406a;--accent-ink:#ffffff;--accent-soft:#f6e3ea;
  --done:#2f8a57;--done-soft:#e3f3e9;--due:#a86b12;--due-soft:#fdf0d5;--danger:#b3261e;--danger-soft:#fbe4e2;
  --radius:14px;
}
/* Dark: when the phone is dark (unless Settings says Light), or when Settings says Dark */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171415;--card:#221e1f;--ink:#f2eceb;--muted:#a89fa1;--line:#3a3234;
  --accent:#e58bab;--accent-ink:#2a1019;--accent-soft:#3b2430;
  --done:#62c98f;--done-soft:#1b3226;--due:#ebb65c;--due-soft:#3a2d15;--danger:#f2877f;--danger-soft:#3d1f1d;
}}
:root[data-theme="dark"]{
  --bg:#171415;--card:#221e1f;--ink:#f2eceb;--muted:#a89fa1;--line:#3a3234;
  --accent:#e58bab;--accent-ink:#2a1019;--accent-soft:#3b2430;
  --done:#62c98f;--done-soft:#1b3226;--due:#ebb65c;--due-soft:#3a2d15;--danger:#f2877f;--danger-soft:#3d1f1d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html[data-size="small"]{zoom:.9}
html[data-size="large"]{zoom:1.12}
html[data-font="rounded"] body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif}
html[data-font="serif"] body{font-family:ui-serif,"New York",Georgia,serif}
html[data-font="classic"] body{font-family:Georgia,"Times New Roman",serif}
html[data-font="avenir"] body{font-family:"Avenir Next",Avenir,-apple-system,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{padding:18px 16px 6px;max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.hdr-right{justify-self:end;display:flex}
#title.tap{cursor:pointer}
#title .caret{font-size:16px;color:var(--muted);vertical-align:middle}
#hdr-mid{text-align:center;display:flex;flex-direction:column;font-size:14px;line-height:1.2}
#hdr-mid span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#settings-btn,.hdr-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
#settings-btn[hidden],.hdr-icon[hidden]{display:none}
#settings-btn svg,.hdr-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header h1{margin:0;font-size:28px;letter-spacing:-.02em}
main{max-width:680px;margin:0 auto;padding:6px 16px 24px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
h3{margin:0;font-size:17px}
h4{margin:12px 0 4px;font-size:14px;color:var(--accent)}
p{margin:2px 0}
ul{margin:2px 0;padding-left:20px}
li{margin:2px 0}
.gap{height:6px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-row.end{justify-content:flex-end}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-height:42px}
textarea{resize:vertical;line-height:1.45}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 0}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;margin-top:8px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}

/* protocol list */
.proto{display:flex;align-items:center;gap:10px}
.proto .grow{flex:1;min-width:0}
.proto .name{font-weight:700}

/* run timeline */
.run-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.run-name{font-weight:700;font-size:17px}
.tl{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.run-top{display:flex;align-items:center;gap:8px}
.run-top .run-h{flex:1;min-width:0}
.tox-btn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--danger-soft);color:var(--danger);font-size:17px;font-weight:800;display:grid;place-items:center}
.run-in{background:var(--bg);margin:8px 0}
.run.finished .run-name{color:var(--muted)}
.countdown{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.countdown .cd{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row.pending{opacity:.75}
.sub-label{font-size:13px;font-weight:700;margin:10px 2px 6px}
.fnote{align-self:center;font-size:13px;color:var(--muted);font-style:italic}
.tl-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:8px 2px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.row .dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
.row .rm{flex:1;min-width:0}
.row .rt{display:block;font-weight:600}
.row .rd{display:block;font-size:13px;color:var(--muted)}
.row .rtime{text-align:right;flex:none}
.row .rtime b{display:block;font-variant-numeric:tabular-nums}
.row .rtime small{font-size:12px;color:var(--muted)}
.row.done{background:var(--done-soft);border-color:transparent}
.row.done .dot{background:var(--done);border-color:var(--done)}
.row.done .rt{color:var(--done)}
.row.due{background:var(--due-soft);border-color:var(--due)}
.row.due .dot{border-color:var(--due)}
.row.due .rtime small{color:var(--due);font-weight:700}
.row.next{border-color:var(--accent)}
.row.next .rtime small{color:var(--accent);font-weight:700}

/* reference */
.search{margin-bottom:10px}
.ref-h{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;font-weight:700;font-size:16px}
.ref-h .chev{color:var(--muted);transition:transform .15s}
.ref.open .chev{transform:rotate(90deg)}
.ref-body{margin-top:8px;font-size:15px}

/* shift */
.chk{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.chk:first-of-type{border-top:0}
.chk.sub{padding-left:28px;font-size:14px}
.chk input{width:22px;height:22px;min-height:0;flex:none;margin:0;accent-color:var(--done)}
.chk.on span{color:var(--muted);text-decoration:line-through}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin:12px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-width:58px;min-height:36px;padding:0 8px;border-radius:9px;border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:6px}
.font-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);font-size:15px;font-weight:600}
.font-opt span{font-size:12px;color:var(--muted);font-weight:400}
.font-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg button{min-height:38px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pt-row{display:grid;grid-template-columns:84px 1fr 44px;gap:8px;margin-top:8px}
.pt-row .btn{padding:0}
.rooms{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.room-tab{flex:none;min-width:84px;display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.room-tab .rn{font-size:18px;font-weight:800;letter-spacing:-.01em}
.room-tab .rk{font-size:12px;color:var(--muted);font-weight:600}
.room-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.room-tab.on .rk{color:var(--accent-ink);opacity:.85}
.room-tab.add{border-style:dashed;color:var(--muted)}
.pt-card{border-left:5px solid var(--accent)}
.remind-banner{display:flex;flex-direction:column;gap:4px;margin:-2px 0 10px}
.remind-item{display:flex;align-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:14px}
.remind-go{flex:1;text-align:left;padding:8px 12px}
.remind-x{flex:none;width:36px;height:36px;color:inherit;opacity:.7}
.remind-item.late{background:var(--due-soft);color:var(--due)}
.remind-sel{width:auto;min-height:34px;padding:4px 6px;font-size:13px;flex:none}
.daily-feet{display:flex;justify-content:center;margin-top:10px;color:var(--accent);opacity:.45}
.daily-feet svg{fill:currentColor}
.daily-line{margin:26px 12px 0;text-align:center;font-size:16px;line-height:1.5;color:var(--muted);font-style:italic}
.ov-card{display:block;width:100%;text-align:left;border-left:5px solid var(--line)}
.ov-room{font-size:22px;font-weight:800;letter-spacing:-.02em}
.ov-lines{margin-top:6px;font-size:14px;line-height:1.5}
.due-txt{color:var(--due)}.miss-txt{color:var(--accent)}
.pt-card.archived{border-left-color:var(--muted)}
.room-tab.prev{color:var(--muted)}
.room-tab.prev.on{background:var(--muted);border-color:var(--muted);color:var(--card)}
.room-tab.prev.on .rk{color:var(--card)}
.pt-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.pt-room{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;padding:2px 2px 6px 10px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);border-bottom-left-radius:4px}
.linkish{color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.pt-links{display:flex;gap:16px}
.type-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);text-align:left;padding:2px 0}
.type-btn svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.it{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.it-main{flex:1;display:flex;align-items:center;gap:10px;padding:10px 0;text-align:left;min-width:0}
.it .dot,.todo .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.it-l{flex:1;font-weight:600}
.it-t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.it.done .dot,.todo.done .dot{background:var(--done);border-color:var(--done)}
.it.done .it-l{color:var(--done)}
.it.due .dot{border-color:var(--due)}
.it.due .it-t{color:var(--due);font-weight:700}
.info-btn{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font:italic 700 14px Georgia,serif}
.info-btn.on{background:var(--accent);color:var(--accent-ink)}
ul.bundle{margin:0 0 8px;padding:8px 12px 8px 30px;background:var(--bg);border-radius:10px;font-size:14px}
ul.bundle li.sub{margin-left:16px;list-style:circle;color:var(--muted)}
.pt-right{display:flex;align-items:center;gap:10px}
.pt-head>div:first-child{flex:1;min-width:0}
.pt-right{flex:none}
.pt-room,.pencil-btn{white-space:nowrap}
.pencil-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:14px}
.pencil-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.todo-add+.chips .chip,.sheet-card .chip{min-width:0;padding:0 12px}
.clock{border-top:1px solid var(--line);padding:4px 0}
.tr{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px dashed var(--line)}
.tr:last-child{border-bottom:0}
body.std-time .tt{width:100px;font-size:15px}
.tt{flex:none;width:74px;white-space:nowrap;height:34px;border-radius:9px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;text-align:left;padding-left:8px}
.tt.done{background:var(--done-soft);color:var(--done)}
.tt.due{background:var(--due-soft);color:var(--due)}
.tr.half .tt{font-size:14px;color:var(--muted);padding-left:18px}
.tr.half .tt.done{color:var(--done)}.tr.half .tt.due{color:var(--due)}
.dash{color:var(--muted)}
.tags{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:5px 0}
.tag{padding:5px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:14px}
.tag.flag::before{content:'⚑ ';color:var(--accent)}
.tag.missed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag.missed::before{color:var(--accent-ink)}
.tag.done{background:var(--bg);border-color:var(--line);color:var(--muted);text-decoration:line-through;font-weight:500}
.tag.done::before{color:var(--muted)}
.flag-btn{flex:none;min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.flag-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chk-line{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.chk-line input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--accent)}
.tr-add{flex:none;width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:20px;border:1px solid transparent}
.tr-add:active{border-color:var(--line)}
.labor-toggle{display:block;width:100%;text-align:left;padding:12px 0;margin-top:6px;border-top:1px solid var(--line);font-weight:700;color:var(--accent)}
.labor-old{opacity:.8}
.todo{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);background:var(--card);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.todo.dragging{position:relative;z-index:2;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18);border-top-color:transparent}
.sheet-card.no-scroll{overflow:hidden;touch-action:none}
.todo.done .it-l{color:var(--muted);text-decoration:line-through}
.todo .x{flex:none;width:32px;height:32px;color:var(--muted)}
.todo-add{display:flex;gap:8px;margin-top:8px}
.plus-btn{width:34px;height:34px;border-radius:10px;font-size:26px;line-height:1;color:var(--accent);display:grid;place-items:center;flex:none}
.sec-toggle{display:block;flex:1;text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:6px 4px 8px;padding:4px 0}
.link-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.link-tile{position:relative;min-width:0}
.link-tile a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:8px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--accent);font-weight:700;font-size:14px;text-align:center;text-decoration:none;line-height:1.2}
.link-tile .info-btn{position:absolute;top:-6px;right:-6px;background:var(--card)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.code-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.code-tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);min-height:50px;min-width:0}
.code-tile .small{font-size:11px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-tile .code{font-size:16px;letter-spacing:.02em}
.code-tile.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-weight:400;font-size:22px;line-height:1}
.sticky-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sticky{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:110px;padding:12px;border-radius:4px 4px 14px 4px;text-align:left;color:#231f20;font-size:15px;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sticky-date{font-size:11px;opacity:.55}
.sticky{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ref{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ref .ref-body{-webkit-user-select:text;user-select:text}
.ref.dragging{position:relative;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.sticky.dragging{position:relative;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.25);transform-origin:center}
body.no-scroll{overflow:hidden;touch-action:none}
.swatches{display:flex;gap:10px;margin-top:12px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.08)}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.qbl-total{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.qbl-total span{font-size:30px}
.qbl-total.over{color:var(--danger)}
.qbl-alert{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.qbl-alert[hidden]{display:none}
.qbl-alert .linkish{color:var(--danger);text-decoration:underline}
.eos-pt{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.eos-pt ul{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--ink)}
.eos-ok{color:var(--done);font-weight:700;font-size:14px}
.qbl-over{color:var(--danger);font-weight:800}
.qgrid{margin-top:10px}
.qhead{display:grid;grid-template-columns:2fr 3fr;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:0 2px 6px}
.qhead.qtot{text-transform:none;letter-spacing:0;font-size:13px;padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.qrow{display:grid;grid-template-columns:2fr 3fr;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.qcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.qcell input,.qcell select{min-height:38px;padding:6px 8px;font-size:15px}
.qnone{align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.qlab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.qitem{display:grid;grid-template-columns:minmax(0,1fr) auto 54px 20px;gap:4px;align-items:center}
.qitem select{font-size:13px;padding:6px 4px;min-width:0}
.qitem input{padding:6px 6px;text-align:center}
.qtimes{color:var(--muted);font-size:13px}
.qx{color:var(--muted);font-size:13px;padding:2px 4px}
.qadd{align-self:flex-start;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0}
.qres{grid-column:1 / -1;font-size:12px;color:var(--muted);text-align:right}
.to-line{padding:8px 0;border-top:1px solid var(--line);font-size:15px;line-height:2}
.to-line input{display:inline-block;width:auto;min-width:90px;max-width:100%;min-height:34px;padding:4px 8px;margin:0 4px}
.to-script{font-size:20px;line-height:1.45;padding-left:26px;margin:10px 0}
.to-script li{margin:6px 0}
.to-script b{color:var(--accent)}
.fundals{border-top:1px solid var(--line);padding:8px 0 10px}
.fund-h{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.info-btn.sm{width:20px;height:20px;font-size:12px;display:inline-grid;place-items:center}
.fedit{display:inline-flex;align-items:center;gap:5px}
.fedit svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:6px 10px;margin-top:6px}
.fgrid+.fgrid{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.fcell{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.fcell .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.fcell.done{background:var(--done-soft);border-color:transparent;color:var(--done)}
.fcell.done .dot{background:var(--done);border-color:var(--done)}
.fcell.due{background:var(--due-soft);border-color:var(--due);color:var(--due)}
.eye-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.eye-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.todo-bar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:2px 0 8px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.todo-bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* call-outs */
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 4px}
.bar span{height:12px;border-radius:4px;background:var(--line)}
.bar span.f1{background:var(--done)}.bar span.f2{background:var(--due)}.bar span.f3{background:var(--danger)}.bar span.f4{background:#1c1819;box-shadow:inset 0 0 0 1px #6f6769}
.pill.black{background:#1c1819;color:#fff;box-shadow:inset 0 0 0 1px #6f6769}
.bar-l{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item.old{opacity:.55}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.04em}
.link{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.link:first-child{border-top:0}
.link a{flex:1;color:var(--accent);font-weight:700;text-decoration:none;font-size:17px}
.pre{white-space:pre-wrap}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.memory{display:block;width:100%;text-align:left;font-size:16px;line-height:1.5}
.memory .muted{margin-bottom:4px}
.verify{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.verify b{color:var(--accent)}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.nav-ico{position:relative;display:block;width:24px;height:24px}
.badge{position:absolute;top:-4px;right:-10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--due);color:#fff;font-size:11px;font-weight:800;line-height:17px;text-align:center}
.badge[hidden]{display:none}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet-card{background:var(--card);width:100%;max-width:680px;max-height:92vh;max-height:calc(100dvh - 16px - env(safe-area-inset-top));overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.step-ed{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.step-ed .h-row button{min-width:34px;min-height:34px;border-radius:8px;border:1px solid var(--line);font-size:15px}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
</style>

<script>
/* ---------- helpers ---------- */
const KEY = 'bellasbook-v1';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const hhmm24 = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }; // for time inputs
// Display times follow Settings → Time format: military "14:30" / "1430", or standard "2:30 PM"
const std = () => state && state.timeFormat === '12';
const clock12 = (h, m) => `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`;
const hhmm = t => { const d = new Date(t); return std() ? clock12(d.getHours(), d.getMinutes()) : hhmm24(t); };
const fmtT = t => std() ? clock12(+t.slice(0, 2), +t.slice(2)) : t; // clock slots like "1430"
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const niceDate = s => s ? parseYmd(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const clone = o => JSON.parse(JSON.stringify(o));

function mins(m) {
  m = Math.round(m);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + 'h' + (r ? ' ' + r + 'm' : '');
}
function fmt(txt) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let html = '', inList = false;
  for (const raw of String(txt || '').split('\n')) {
    const l = raw.trimEnd();
    if (/^\s*[-•]\s+/.test(l)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(l.replace(/^\s*[-•]\s+/, '')) + '</li>';
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^#\s+/.test(l)) html += '<h4>' + inline(l.replace(/^#\s+/, '')) + '</h4>';
    else if (!l.trim()) html += '<div class="gap"></div>';
    else html += '<p>' + inline(l) + '</p>';
  }
  if (inList) html += '</ul>';
  return html;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- default content (from Bella's Book, 3/2026 + 9/2026 updates) ---------- */
const S = (label, detail, kind, offset = 0, every = 0, count = 1) => ({ id: uid(), label, detail, kind, offset, every, count });

function defaultProtocols() {
  const d = '2026-09-24';
  return [
    { id: 'mag', name: 'Magnesium', goLabel: 'Start bolus', updated: d,
      // Phase 0 = bolus/loading (20 min); phase 1 = maintenance, timed from when it starts
      phases: [{ label: 'Loading', go: 'Start bolus', started: 'Bolus' }, { label: 'Maintenance', go: 'Start maintenance', started: 'Maintenance' }], info:
`Therapeutic = 4–7 mg/dL
# Bolus
4 g/100 mL — pump duration 20 min (runs at 300 mL/hr)
# Maintenance
20 g/500 mL — pump 2 g/hr (runs at 50 mL/hr, duration 10 hrs)
Can be 1 g/hr — depends on order
# Fluids
Total max 125 mL/hr (e.g. LR 75 + Mag 50 — if you add pit, decrease LR)`,
      steps: [
        S('Collect supplies', 'SCDs, hammer for reflexes, 2nd IV pump, bedside commode', 'before'),
        S('Pre-mag assessment', 'V/S, DTRs, lungs', 'before'),
        { ...S('V/S & DTRs', 'q5min', 'timed', 5, 5, 4), phase: 0 },
        { ...S('V/S & DTRs', 'q15min', 'timed', 15, 15, 4), phase: 1 },
        { ...S('Mag assessment', 'q1h', 'timed', 120, 60, 1), phase: 1, note: 'then q1h on your shift paper' },
        { ...S('Urine', 'q4h', 'timed', 240, 240, 1), phase: 1, note: 'then q4h on your shift paper' },
      ] },
    { id: 'blood', name: 'Blood transfusion', goLabel: 'Start transfusion', updated: d, info:
`Supplies: separate IV, blood consent, blood, NS, blood tubing, pump
1. Prime tubing with NS, then clamp
2. Spike blood, fill chamber ¼–½ way
3. Prime tubing with blood
4. Connect to IV by itself
Must be infused within 4 hrs of receiving (150 mL/hr is fine)
# Reaction signs
- Temp ≥ 100.4 (or up 2°)
- Chills, hives, itching
- Respiratory distress
- Hypotension
- Lower back pain`,
      steps: [
        S('Collect supplies', '2nd IV, blood consent, blood, NS, blood tubing, pump', 'before'),
        S('Set up', 'Prime tubing with NS, clamp → spike blood, fill chamber ¼–½ → prime tubing with blood → connect to 2nd IV', 'before'),
        S('Pre-checklist charted', 'Within 30 min of picking up blood', 'before'),
        S('V/S charted before starting', '', 'before'),
        S('Running at 25 mL/hr', 'Watch for reaction', 'timed', 0, 0, 1),
        S('15-min V/S', 'Then increase to ordered rate or 150 mL/hr', 'timed', 15, 0, 1),
        S('V/S when done', '', 'end'),
        S('Run pump / flush tubing to clear line', '', 'end'),
      ] },
    { id: 'rec-vag', name: 'Recovery — vaginal', short: 'vaginal', goLabel: 'Start recovery', style: 'grid', updated: d, info:
`Start at delivery.
q15min ×8 → check when up to MBU → repeated in 1 hr → q6h until 24 hrs PP`,
      steps: [
        S('Recovery check', 'q15min', 'timed', 15, 15, 8),
        S('Recovery check', 'q30min', 'timed', 150, 0, 1),
        S('Recovery check', 'q1h', 'timed', 210, 0, 1),
        S('Recovery check', 'q6h until 24 hrs PP', 'timed', 570, 360, 3),
      ] },
    { id: 'rec-cs', name: 'Recovery — C/S', short: 'C/S', goLabel: 'Start recovery', style: 'grid', updated: d, info:
`Start at delivery.
q15min ×8 → q30min ×2 → q1h ×4 → q4h until 24 hrs PP`,
      steps: [
        S('Recovery check', 'q15min', 'timed', 15, 15, 8),
        S('Recovery check', 'q30min', 'timed', 150, 30, 2),
        S('Recovery check', 'q1h', 'timed', 240, 60, 4),
        S('Recovery check', 'q4h until 24 hrs PP', 'timed', 660, 240, 4),
      ] },
  ];
}

// Reference is split into Meds and Other
const MED_CARDS = ['Blood transfusion reaction', 'Magnesium toxicity', 'Fluids', 'Diluting IV meds', 'Betamethasone', 'Miso / Cytotec', 'Terbutaline', 'Meds & fluids', 'Pitocin', 'Magnesium', 'Epidural', 'PPH meds', 'Blood transfusion'];
const refCat = title => MED_CARDS.includes(title) ? 'meds' : 'other';
// Cards that can start a timed checklist
const CARD_TIMERS = { 'Magnesium': ['mag'], 'Blood transfusion': ['blood'], 'Recovery fundals': ['rec-vag', 'rec-cs'] };
// Default order: Meds A–Z; Other in the order below (cards you add go at the end of their section)
const OTHER_ORDER = ['Phone extensions', 'Admit / triage', 'Bands', 'Prenatals', 'Labs & blood draws', 'Swabs', 'Values', 'Gestational Policies', 'Temp', 'BP Tx',
  'Decels', 'IUPC / MVUs', 'Amnioinfusion', 'Cook balloon', 'QBL', 'JADA', 'Recovery fundals', 'Anesthesia staff', 'Surgical tech staff', 'C/S prep & OR', 'C/S timeout', 'After Delivery', 'Placenta/pathology form'];
function sortRefs(list) {
  const meds = list.filter(r => r.cat === 'meds').sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
  const pos = r => { const i = OTHER_ORDER.indexOf(r.title); return i < 0 ? 999 : i; };
  const other = list.filter(r => r.cat !== 'meds').map((r, i) => [r, i]).sort((a, b) => pos(a[0]) - pos(b[0]) || a[1] - b[1]).map(x => x[0]);
  return [...meds, ...other];
}
function defaultRefs() {
  const R = (title, body) => ({ id: uid(), title, body, cat: refCat(title), protos: CARD_TIMERS[title] || [], updated: '2026-09-25' });
  return sortRefs([
    R('Phone extensions',
`NICU — *94985
MBU — *94650
4West (rooms 473+) — *94655
Lab — *94720 (#1)
MFM — *94972
EVS — *33221
Registration — *94515
# Transfer a call
Transfer button → dial Rm # (found in green book) → Transfer button again`),
    R('Admit / triage',
`# Registration terms
- Direct admit / induction = "activate a pre-in"
- Admit from triage = "make an OBED in-pt"
# Phone call from pt coming in
Name, doctor, G/P, gestation, reason for visit
# Admission questions
- EDC · G __ P __ (SAB/TAB?) · prior pregnancies
- Ctx? onset · ROM? time · bleeding? · fetal movement
- Pregnancy complications (anemia, GDM, GHTN)
- PMHx (asthma? STIs?) · allergies · meds · surgeries · anesthesia complications?
- Height / weight / pre-preg weight
- FoB · girl/boy (circ?) · breast/bottle/both
- Epidural? / preferences
- Last appt · cervical exam? · IVF/IUI pregnancy?
- GBS +/- · RhoGAM?
- Tdap, COVID, flu vaccines
- S/S in last 10 days?
- Sex in last 24 hours?
- Smoke / alcohol / drug use?
- Thoughts of harming self/others? Safe at home?`),
    R('Labs & blood draws',
`- **Purple** = CBC — order CBC w/out diff (unless specifically requested or pt is sick/septic)
- **Pink** = Type & Screen
- **Green** = BMP (compMet) and troponin
- **Gray** = lactic acid — no restricting band; put in cup of ice on way to lab
- **Cultures** = bottles sent from lab, new stick, blood directly into bottles (same as tubes) until liquid is "bloody"
After delivery: draw pink and purple`),
    R('Values',
`- P/C ratio < 0.3 (0.3+ is pre-eclampsia)
- Rubella immune > 0.99
- BG (per hospital policy) = 70–110
- Cord pH < 7.2 = acidotic (decreased oxygenation)
# RhoGAM
Given at 26–28 wks and within 72 hrs after delivery — "RHIG" order
# BPP (biophysical profile) — max 10/10
2 pts each: fetal movement, fetal tone, fetal breathing, AFI, fetal HR (if FHR not included, scored /8)
# AFI
- Normal = 5–25
- Oligo < 5
- Poly > 25`),
    R('Fluids',
`Maintenance fluids max = **125 mL/hr** total
e.g. LR 75 + Mag 50 — if you add pit, decrease LR`),
    R('Diluting IV meds',
`Dilute in a flush:
- Benadryl
- Pepcid

function mergeLinks(links) {

  for (const dl of DEFAULT_LINKS) {

/* ---------- protocols ---------- */
function describeStep(s) {
  if (s.kind === 'before') return 'Before start';
  if (s.kind === 'end') return 'When finished';
  const n = +s.count || 0, ev = +s.every || 0, off = +s.offset || 0;
  if (n === 1 || ev <= 0) return 'At ' + mins(off);
  return 'q' + mins(ev).replace(' min', 'min') + (n ? ' ×' + n : ' ongoing') + ', first at ' + mins(off);
}

function instances(run) {
  const out = [], horizon = Date.now() + 3 * 3600e3;
  if (run.start == null) return out; // still setting up
  run.proto.steps.forEach(st => {
    if (st.kind !== 'timed') return;
    const base = phaseStart(run, st.phase || 0);
    if (base == null) return; // that phase hasn't started yet
    const n = +st.count || 0, ev = +st.every || 0;
    for (let i = 0; i < 400; i++) {
      if (n && i >= n) break;
      if (ev <= 0 && i > 0) break;
      const t = base + ((+st.offset || 0) + i * ev) * 60000;
      if (!n && i > 0 && t > horizon) break;
      out.push({ key: st.id + ':' + i, t, st, i, n });
    }
  });
  return out.sort((a, b) => a.t - b.t);
}

// A one-time check at 0 min (e.g. "Running at 25 mL/hr") is the start itself, so it's checked off with the start time
// Maintenance started on a patient's timer → the Shift time clock takes over after the q15 checks:
// Mag q1h and Urine q4h from their first times (the timer still shows those first ones for reference)
// Take a timer's (unchecked) clock checks back off its patient
function clearRunTags(run) {
  const pt = run.ptId && state.shift && state.shift.patients.find(p => p.id === run.ptId);
  if (pt) pt.tags = pt.tags.filter(g => !(g.runId === run.id && !g.done));
}
function magToClock(run) {
  const pt = runPt(run);
  if (!pt) return;
  const times = gridTimes(), added = [];
  [['Mag assessment', 'Mag', 60, true], ['Urine', 'Urine', 240, false]].forEach(([stepLabel, tag, every, flag]) => {
    const st = run.proto.steps.find(x => x.label === stepLabel);
    if (!st) return;
    const firstMs = phaseStart(run, st.phase || 0) + (+st.offset || 0) * 60000;
    const first = times.find(t => slotMs(t) >= firstMs - 15 * 60000);
    if (!first) return;
    const s0 = sinceStart(first);
    times.filter(t => sinceStart(t) >= s0 && (sinceStart(t) - s0) % every === 0)
      .filter(t => !pt.tags.some(g => g.t === t && g.label === tag))
      .forEach(t => { pt.tags.push({ id: uid(), t, label: tag, done: false, flag, runId: run.id }); added.push(tag + ' ' + t); });
  });
  if (added.length) toast(`Mag q1h & urine q4h added to ${roomLabel(pt)}'s time clock`);
}
const phaseStart = (run, ph) => ph ? (run.phases || {})[ph] ?? null : run.start;
function markStarted(run, ph = 0) {
  run.proto.steps.filter(st => st.kind === 'timed' && (st.phase || 0) === ph && !(+st.offset) && (+st.count || 0) <= 1)
    .forEach(st => { run.done[st.id + ':0'] = phaseStart(run, ph); });
}
const cdText = ms => {
  if (ms <= 0) return 'now';
  const sec = Math.round(ms / 1000);
  return sec >= 3600 ? Math.floor(sec / 3600) + 'h ' + pad(Math.floor(sec % 3600 / 60)) + 'm' : Math.floor(sec / 60) + ':' + pad(sec % 60);
};
setInterval(() => $$('[data-cd]').forEach(el => { el.textContent = cdText(+el.dataset.cd - Date.now()); }), 1000);
function relText(t, now) {
  const d = Math.round((t - now) / 60000);
  if (d > 0) return 'in ' + mins(d);
  if (d === 0) return 'due now';
  return 'due ' + mins(-d) + ' ago';

function countedInst(run) {

  if (run.proto.style !== 'grid' || ui.runMore[run.id]) return inst;

function runDue(run) {

  if (run.start == null) {

    return `<span class="pill">Setting up${left ? ' · ' + left + ' left' : ' ✓'}</span>`;
  }
  if (dueCount) return `<span class="pill due">${dueCount} due</span>`;

  runGo(d) {

  tick(d) {

      <div class="grid2">${phs.map((ph, i) => phaseStart(run, i) != null ? `<label class="f">${esc(ph.started === 'Start' ? 'Start time' : ph.started + ' started')}<input type="time" data-ph="${i}" value="${hhmm24(phaseStart(run, i))}"></label>` : '').join('')}
      <label class="f">Label<input id="st-label" value="${esc(run.label)}"></label></div>

  runSave(d) {

    $$('[data-ph]').forEach(inp => {

  runEnd(d) {
    const run = state.runs.find(r => r.id === d.id), now = Date.now();
    const open = countedInst(run).filter(x => !run.done[x.key]);
    const missed = open.filter(x => x.t <= now).length + run.proto.steps.filter(st => st.kind === 'before' && !run.done[st.id + ':b']).length;
    const upcoming = open.filter(x => x.t > now).length;
    if (!missed && !upcoming) { actions.runEndGo(d); return; }
    openSheet(`<h3>Finish ${esc(run.proto.name)}${run.label ? ' · ' + esc(run.label) : ''}?</h3>
      <p class="small" style="margin-top:6px">${missed ? `<b>${missed}</b> check${missed === 1 ? '' : 's'} not checked off` : ''}${missed && upcoming ? ' and ' : ''}${upcoming ? `<b>${upcoming}</b> still upcoming` : ''}.
      It'll be folded up and kept so you can look back at it.</p>
      <div class="btn-row end"><button class="btn" data-a="closeSheet">Keep going</button>
      <button class="btn primary" data-a="runEndGo" data-id="${run.id}">Finish</button></div>`);

  runEndGo(d) {
    const run = state.runs.find(r => r.id === d.id);

  runReopen(d) { delete state.runs.find(r => r.id === d.id).finishedAt; save(); render(); },
  runDelete(d) {
    const run = state.runs.find(r => r.id === d.id);
    if (!confirm(run.finishedAt ? 'Delete this record for good?' : `Delete this ${run.proto.name} timer? Anything it added to a time clock (not yet checked off) is removed too.`)) return;

  runMove(d) {
    const run = state.runs.find(r => r.id === d.id), pt = d.p ? curPt(d.p) : null;

    clearRunTags(run);
    Object.assign(run, { ptId: pt ? pt.id : null, room: pt ? pt.room : '' });
    if (pt && run.proto.id === 'mag' && phaseStart(run, 1) != null) magToClock(run);
    save(); actions.runEdit({ id: run.id }); render(); toast(pt ? `Moved to ${roomLabel(pt)}` : 'Now running on its own');

  startType(d) { Object.assign(ui.startDraft, { type: d.type, start: shiftHours(d.type)[0], end: shiftHours(d.type)[1] }); render(); },
  sdAdd() { ui.startDraft.pts.push({ room: '', kind: 'labor' }); render(); },
  sdDel(d) { ui.startDraft.pts.splice(+d.i, 1); render(); },
  shiftStart() {
    const sd = ui.startDraft;
    const pts = sd.pts.filter(x => x.room.trim()).map(x => newPatient(x.room.trim(), x.kind));
    if (sd.pts.some(x => !x.room.trim()) && !confirm('Patients without a room number will be skipped. Start anyway?')) return;
    state.shift = { startedAt: Date.now(), date: today(), type: sd.type, startMin: sd.start, endMin: sd.end, patients: pts, currentId: pts[0] ? pts[0].id : null };
    pts.forEach(p => { p.tags = stripTags(false); });
    ui.startDraft = null; save(); render(); window.scrollTo(0, 0);
  },
  // End of shift: review anything still open, then Clock out
  shiftEnd() {
    const pts = activePts(), now = Date.now();
    const blocks = pts.map(p => {
      const open = [];
      const chk = (k, label) => { if (!p.done[k]) open.push(label); };
      chk('report1', 'Report received');
      if (!p.deliveredAt && !p.dischargedAt) chk('start', BUNDLES[{ labor: 'start', admit: 'admission', cs: 'admission', triage: 'triage' }[p.kind]]);
      if (p.deliveredAt) {
        chk('pp:delivery', 'Delivery charting');
        if (isCsDelivery(p)) chk('pp:cscharting', 'C/S charting');
        chk('pp:pph', 'PPH paper'); chk('pp:charge', 'Charge sheet'); chk('pp:report', 'Report given');
      } else if (p.dischargedAt) chk('dc:charting', 'Discharge charting');
      else chk('report2', 'Report given');
      const late = p.tags.filter(g => !g.done && sinceStart(g.t) < shiftLen() && slotMs(g.t) <= now).length;
      if (late) open.push(`${late} time-clock item${late === 1 ? '' : 's'} not checked off`);
      const todos = p.todos.filter(t => !t.done);
      if (todos.length) open.push(`To-do: ${todos.map(t => esc(t.text)).join(', ')}`);
      state.runs.filter(r => r.ptId === p.id && !r.finishedAt).forEach(r => open.push(`${esc(r.proto.name)} timer still running`));
      return `<div class="eos-pt"><b>${esc(roomLabel(p))}</b>${open.length
        ? `<ul>${open.map(o => `<li>${o}</li>`).join('')}</ul>` : ' <span class="eos-ok">✓ all caught up</span>'}</div>`;
    }).join('');
    const solo = state.runs.filter(r => !runPt(r) && !r.finishedAt);
    openSheet(`<h3>Before you clock out</h3>
      <p class="muted small" style="margin-top:4px">Anything still open this shift:</p>
      ${blocks || '<p class="empty">No patients this shift.</p>'}
      ${solo.length ? `<div class="eos-pt"><b>On its own</b><ul>${solo.map(r => `<li>${esc(r.proto.name)} timer still running</li>`).join('')}</ul></div>` : ''}
      <p class="muted small" style="margin-top:10px">Clocking out clears this shift's patients.</p>
      <div class="btn-row end"><button class="btn" data-a="closeSheet">Back</button>
      <button class="btn primary" data-a="clockOut">Clock out</button></div>`);
  },
  clockOut() {
    state.shift = null; state.runs = state.runs.filter(r => !(r.ptId && r.finishedAt)); save(); closeSheet(); render(); window.scrollTo(0, 0); toast('Clocked out — now go relax!');
  },
  shiftMenu() {
    if (!state.shift) return;
    const sh = state.shift;
    ui.shiftDraft = ui.shiftDraft || { type: sh.type, start: sh.startMin, end: sh.endMin };
    const sd = ui.shiftDraft;
    openSheet(`<h3>Shift</h3>
      <div class="seg" style="margin-top:12px">
        <button class="${sd.type === 'day' ? 'on' : ''}" data-a="smType" data-type="day">Day</button>
        <button class="${sd.type === 'night' ? 'on' : ''}" data-a="smType" data-type="night">Night</button></div>
      <div class="grid2"><label class="f">Start<select data-sm-time="start">${timeOptions(sd.start)}</select></label>
        <label class="f">End<select data-sm-time="end">${timeOptions(sd.end)}</select></label></div>
      <p class="muted small" style="margin-top:8px">Started ${niceDate(sh.date)} at ${hhmm(sh.startedAt)}. Resets on its own 18 hrs after that.</p>
      <div class="btn-row"><button class="btn danger" data-a="shiftEnd">End shift</button>
      <span style="flex:1"></span><button class="btn" data-a="closeSheet">Cancel</button>

  smType(d) { Object.assign(ui.shiftDraft, { type: d.type, start: DEFAULT_HOURS[d.type][0], end: DEFAULT_HOURS[d.type][1] }); actions.shiftMenu(); },
  shiftMenuSave() {
    const sh = state.shift, sd = ui.shiftDraft;
    if (sd.start === sd.end) { toast('Start and end can\'t be the same'); return; }
    Object.assign(sh, { type: sd.type, startMin: sd.start, endMin: sd.end });
    // Re-fit hourly strips to the new hours
    const base = gridTimes().filter((_, i) => i % 2 === 0);
    sh.patients.forEach(p => {
      p.tags = p.tags.filter(g => g.done || sinceStart(g.t) < shiftLen() && (g.label !== 'Strip' || base.includes(g.t)));
      if (p.tags.some(g => g.label === 'Strip') || !p.tags.length) base.forEach(t => {
        if (!p.tags.some(g => g.t === t && g.label === 'Strip')) p.tags.push({ id: uid(), t, label: 'Strip', done: false });
      });
    });
    save(); closeSheet(); render(); toast('Shift hours updated');
  },

  let h = `<div class="sec">Postpartum recovery · delivered ${hhmm(p.deliveredAt)}</div>`;
  const b = isCsDelivery(p) ? 'cs' : 'vaginal';
  // Both just say "Delivery charting" on the page; each keeps its own list behind the i
  if (b === 'cs') h += itemHtml(p, 'pp:delivery', 'Delivery charting', { bundle: 'csDelivery' }) + itemHtml(p, 'pp:cscharting', BUNDLES.cs, { bundle: 'cs' });
  else h += itemHtml(p, 'pp:delivery', 'Delivery charting', { bundle: 'vaginal' });
  // Fundals march out from the first one, in two columns like on paper
  const first = p.fundalStart || p.deliveredAt + 15 * 60000;
  h += `<div class="fundals"><div class="h-row"><button class="fund-h" data-a="fundalPolicy" data-p="${p.id}">Fundals${b === 'cs' ? ' · C/S' : ''} <span class="info-btn sm">i</span></button>
    <button class="linkish fedit" data-a="fundalTime" data-p="${p.id}">first at ${hhmm(first)} ${PENCIL_SVG}</button></div>`;
  let i = 0;
  fundalOffsets(p).forEach(group => {
    h += `<div class="fgrid" style="grid-template-rows:repeat(${Math.ceil(group.length / 2)},auto)">`;
    group.forEach(off => {
      const t = first + off * 60000, k = 'pp:fundal' + i++, on = !!p.done[k];
      h += `<button class="fcell${on ? ' done' : t <= now ? ' due' : ''}" data-a="ptItem" data-p="${p.id}" data-k="${k}">
        <span class="dot">${on ? '✓' : ''}</span><span>${hhmm(t)}</span></button>`;
    });
    h += '</div>';
  });
  h += '</div>';
  h += `<button class="item" data-a="qblOpen" data-p="${p.id}"><span class="grow"><b>QBL tracker</b></span><span class="${qblOver(p) ? 'qbl-over' : 'muted'}">${qblTotal(p) ? (qblOver(p) ? '⚠ ' : '') + qblTotal(p) + ' mL' : ''} ›</span></button>`;
  h += itemHtml(p, 'pp:pph', 'PPH paper') + itemHtml(p, 'pp:charge', 'Charge sheet') + itemHtml(p, 'pp:report', 'Report given');
  return h;
}
function dcHtml(p) {
  return `<div class="sec">Discharged · ${hhmm(p.dischargedAt)}</div>`
    + itemHtml(p, 'dc:charting', BUNDLES.discharge, { bundle: 'discharge' })
    + (p.archivedAt ? '' : `<button class="btn block" style="margin:10px 0 4px" data-a="patientDelete" data-id="${p.id}">Remove ${esc(roomLabel(p))} from my list</button>`);
}
// Compact to-do bar at the top of the page; the full list opens as a popup
function todoBar(p) {
  const left = p.todos.filter(t => !t.done), next = left[0];
  return `<button class="todo-bar" data-a="todoOpen" data-p="${p.id}">
    <span class="grow"><b>To-do</b>${next ? `<span class="muted small"> · ${esc(next.text)}${left.length > 1 ? '…' : ''}</span>` : ''}</span>
    ${!p.todos.length ? '<span class="muted small">Add ›</span>'
      : left.length ? `<span class="pill due">${left.length} left</span>` : '<span class="pill done">All done ✓</span>'}</button>`;
}
function renderTodoSheet() {
  if (!ui.todoSheet) return;
  const p = curPt(ui.todoSheet);
  const hide = state.hideDoneTodos, nDone = p.todos.filter(t => t.done).length;
