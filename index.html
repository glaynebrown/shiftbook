const REMIND_CHOICES = [0, 5, 10, 15, 30, 60];
const remindOptions = (cur, short) => REMIND_CHOICES.map(m => `<option value="${m}"${m === cur ? ' selected' : ''}>${m ? (short ? '⏰ ' + m + 'm' : m + ' min before') : (short ? '⏰ Off' : 'Off')}</option>`).join('');
// Banner under the room buttons: items with a reminder whose reminder window has opened (and aren't done yet)
function reminderBanner() {
  const now = Date.now(), items = [];
  activePts().forEach(p => p.tags.forEach(g => {
    if (g.done || g.dismissed || !g.remind || sinceStart(g.t) >= shiftLen()) return;
    const at = slotMs(g.t);
    if (now >= at - g.remind * 60000) items.push({ p, g, at });
  }));
  if (!items.length) return '';
  items.sort((a, b) => a.at - b.at);
  return `<div class="remind-banner">${items.slice(0, 4).map(({ p, g, at }) => {
    const d = Math.round((at - now) / 60000);
    return `<div class="remind-item${d <= 0 ? ' late' : ''}"><button class="remind-go" data-a="selPt" data-id="${p.id}">⏰ <b>${esc(roomLabel(p))}</b> · ${esc(g.label)} at ${fmtT(g.t)} · ${d > 0 ? 'in ' + mins(d) : d === 0 ? 'now' : mins(-d) + ' ago'}</button>
      <button class="remind-x" data-a="remindClose" data-p="${p.id}" data-id="${g.id}" aria-label="Close reminder">✕</button></div>`;
  }).join('')}${items.length > 4 ? `<div class="muted small">+${items.length - 4} more</div>` : ''}</div>`;
}

// One compact card per patient: what's due, what's next, to-dos and timers
function overviewCard(p) {
  const now = Date.now(), lines = [];
  if (p.deliveredAt) {
    const first = p.fundalStart || p.deliveredAt + 15 * 60000;
    const offs = fundalOffsets(p)[0], left = offs.map((o, i) => ({ t: first + o * 60000, k: 'pp:fundal' + i })).filter(x => !p.done[x.k]);
    const late = left.filter(x => x.t <= now).length;
    lines.push(left.length ? `Fundals ${offs.length - left.length}/${offs.length}${late ? ` · <b class="due-txt">${late} due</b>` : ` · next ${hhmm(left[0].t)}`}` : 'Fundals done ✓');
  } else {
    const open = p.tags.filter(g => !g.done && sinceStart(g.t) < shiftLen());
    const late = open.filter(g => slotMs(g.t) <= now), missedFlag = late.filter(g => g.flag).length;
    const upcoming = open.filter(g => slotMs(g.t) > now).sort((a, b) => sinceStart(a.t) - sinceStart(b.t));
    const nextT = upcoming[0] && upcoming[0].t;
    if (late.length) lines.push(`<b class="${missedFlag ? 'miss-txt' : 'due-txt'}">${late.length} past due</b>${missedFlag ? ` (${missedFlag} flagged)` : ''}`);
    if (nextT) lines.push(`Next ${fmtT(nextT)} · ${upcoming.filter(g => g.t === nextT).map(g => esc(g.label)).join(', ')}`);
  }
  const todoLeft = p.todos.filter(t => !t.done);
  if (todoLeft.length) lines.push(`To-do: ${todoLeft.length} left · ${esc(todoLeft[0].text)}`);
  state.runs.filter(r => r.ptId === p.id && !r.finishedAt).forEach(r => {
    const due = runDue(r);
    lines.push(`${esc(r.proto.name)}${due ? ` · <b class="due-txt">${due} due</b>` : ''}`);
  });
  return `<button class="card ov-card" data-a="selPt" data-id="${p.id}">
    <div class="h-row"><span class="ov-room">${esc(roomLabel(p))}</span>
      <span class="muted small">${KINDS[p.kind]}${p.deliveredAt ? ' · PP' : ''}${p.dischargedAt ? ' · D/C' : ''} ›</span></div>
    ${lines.length ? `<div class="ov-lines">${lines.map(l => `<div>${l}</div>`).join('')}</div>` : '<div class="ov-lines muted">Nothing due</div>'}</button>`;
}

function renderShift() {
  const sh = state.shift;
  if (!sh) return renderShiftStart();
  const cur = sh.currentId === 'overview' ? null : sh.patients.find(p => p.id === sh.currentId) || activePts()[0];
  const prevCount = sh.patients.filter(p => p.archivedAt).length;
  let h = '';
  h += `<div class="rooms">${activePts().map(p => `<button class="room-tab${cur && p.id === cur.id ? ' on' : ''}" data-a="selPt" data-id="${p.id}">
      <span class="rn">${esc(roomLabel(p))}</span><span class="rk">${p.deliveredAt ? (isCsDelivery(p) ? 'PP · C/S' : 'PP') : p.dischargedAt ? 'D/C' : KIND_SHORT[p.kind]}</span></button>`).join('')}
      <button class="room-tab add" data-a="patientEdit" data-id="new"><span class="rn">+</span><span class="rk">Add</span></button>
      ${prevCount ? `<button class="room-tab prev${cur && cur.archivedAt ? ' on' : ''}" data-a="previousPts"><span class="rn">↺ ${prevCount}</span><span class="rk">Previous</span></button>` : ''}</div>`;
  h += reminderBanner();
  if (cur) {
    if (cur.archivedAt) h += `<div class="verify">Previous patient · ${cur.done.handoff ? 'handed off' + (cur.handedOffTo ? ' to ' + esc(cur.handedOffTo) : '') : 'removed'} ${hhmm(cur.archivedAt)}</div>`;
    h += `<div class="card pt-card${cur.archivedAt ? ' archived' : ''}">
      <div class="pt-head"><div>
        <button class="type-btn" data-a="patientEdit" data-id="${cur.id}">${KINDS[cur.kind]}${cur.admittedAt ? ' · from triage' : ''}${cur.deliveredAt ? (isCsDelivery(cur) ? ' · delivered by C/S' : ' · delivered') : ''}${cur.dischargedAt ? ' · discharged' : ''} ${PENCIL_SVG}</button>
        ${cur.archivedAt ? '' : `<div class="pt-links"><button class="linkish" data-a="tools" data-p="${cur.id}">Tools</button></div>`}</div>
        <div class="pt-right">${cur.archivedAt ? '' : `<button class="pencil-btn" data-a="pencilMenu" data-p="${cur.id}" aria-label="Add what applies to this patient">＋ Add</button>`}
        <button class="pt-room" data-a="roomEdit" data-id="${cur.id}" aria-label="Change room number">${esc(roomLabel(cur))}</button></div></div>`;
    h += todoBar(cur);
    const ptRuns = state.runs.filter(r => r.ptId === cur.id && (!cur.archivedAt || r.finishedAt));
    h += [...ptRuns.filter(r => !r.finishedAt), ...ptRuns.filter(r => r.finishedAt)].map(r => renderRun(r, true)).join('');
    if (cur.deliveredAt || cur.dischargedAt) {
      h += (cur.deliveredAt ? ppHtml(cur) : dcHtml(cur))
        + `<button class="labor-toggle" data-a="laborToggle" data-p="${cur.id}">${ui.showLabor[cur.id] ? '▾' : '▸'} ${cur.kind === 'triage' ? 'Triage' : 'Labor'} charting</button>`;
      if (ui.showLabor[cur.id]) h += `<div class="labor-old">${laborHtml(cur)}</div>`;
    } else {
      h += laborHtml(cur);
      if (cur.kind === 'triage') h += `<div class="grid2" style="margin-top:14px">
          <button class="btn" data-a="discharge" data-p="${cur.id}">Discharge</button>
          <button class="btn primary" data-a="admit" data-p="${cur.id}">Admit →</button></div>`;
      else h += `<button class="btn primary block" style="margin-top:14px" data-a="deliver" data-p="${cur.id}">Delivered →</button>`;
    }
    h += `<div class="sec">Notes</div>
      <textarea rows="4" data-ptnotes="${cur.id}" style="margin-top:6px" placeholder="Notes for ${esc(roomLabel(cur))}">${esc(cur.notes || '')}</textarea>
      ${cur.archivedAt ? '' : `<button class="btn block" style="margin-top:14px" data-a="handoff" data-p="${cur.id}">Hand off ${esc(roomLabel(cur))}</button>`}</div>`;
  } else if (activePts().length) {
    h += activePts().map(overviewCard).join('');
  } else {
    h += `<p class="empty">No patients yet. Tap <b>+ Add</b> to add one.</p>`;
  }
  h += `<button class="sec-toggle" style="margin-top:22px" data-a="asNeededToggle">${state.asNeededHidden ? '▸' : '▾'} As-needed charting</button>
    ${state.asNeededHidden ? '' : `<div class="card">${bundleHtml(state.lists.asNeeded)}</div>`}`;
  return h;
}

/* ---------- call-outs ---------- */
const rollOff = s => { const d = parseYmd(s); d.setFullYear(d.getFullYear() + 1); return ymd(d); };
function level(p) {
  if (p >= 7) return { t: 'Sent to HR', c: 'black', note: 'Can result in disciplinary action' };
  if (p >= 6) return { t: 'Written counseling', c: 'danger' };
  if (p >= 4) return { t: 'Verbal counseling', c: 'due' };
  return { t: 'No counseling', c: 'done' };
}
function renderCallouts() {
  const t = today();
  const all = [...state.callouts].sort((a, b) => b.date.localeCompare(a.date));
  const active = all.filter(c => rollOff(c.date) > t), old = all.filter(c => rollOff(c.date) <= t);
  const pts = active.length, lv = level(pts), nxt = level(pts + 1);
  const nextOff = active.map(c => rollOff(c.date)).sort()[0];
  const daysTo = nextOff ? Math.round((parseYmd(nextOff) - parseYmd(t)) / 864e5) : 0;
  const untilNext = pts < 4 ? `${4 - pts} more until verbal counseling` : pts < 6 ? `${6 - pts} more until written counseling` : pts < 7 ? '1 more sends it to HR' : '';
  let h = `<div class="card">
    <div class="h-row"><div><div class="big">${pts}</div><div class="muted small">point${pts === 1 ? '' : 's'} in the last year</div></div>
    <span class="pill ${lv.c}">${lv.t}</span></div>
    <div class="bar">${[1, 2, 3, 4, 5, 6, 7].map(i => `<span class="${i <= pts ? (i >= 7 ? 'f4' : i >= 6 ? 'f3' : i >= 4 ? 'f2' : 'f1') : ''}"></span>`).join('')}</div>
    <div class="bar-l"><span>1</span><span>2</span><span>3</span><span>4<br>verbal</span><span>5</span><span>6<br>written</span><span>7<br>HR</span></div>
    ${lv.note ? `<p class="small" style="margin-top:12px"><b>${lv.note}</b></p>` : ''}
    ${untilNext ? `<p class="small" style="margin-top:12px">${untilNext}</p>` : ''}
    ${nextOff ? `<p class="small">Next point drops off <b>${niceDate(nextOff)}</b> (${daysTo} day${daysTo === 1 ? '' : 's'})</p>` : ''}
    <p class="small muted">If you call out today: ${pts + 1} point${pts ? 's' : ''} — ${nxt.t.charAt(0).toLowerCase() + nxt.t.slice(1)}${nxt.note ? ' (' + nxt.note.toLowerCase() + ')' : ''}</p>
    <button class="btn primary block" style="margin-top:12px" data-a="itemEdit" data-list="callouts" data-id="new">+ Log a call-out</button>
    <div class="tl-label" style="margin-top:16px">Active (${active.length})</div>
    <div>${active.length ? active.map(c => calloutRow(c, false)).join('') : '<p class="empty">No active call-outs.</p>'}</div>`;
  if (old.length) {
    h += `<button class="btn block" style="margin-top:8px" data-a="toggleOld">${ui.showOld ? 'Hide' : 'Show'} dropped off (${old.length})</button>`;
    if (ui.showOld) h += `<div style="margin-top:6px">${old.map(c => calloutRow(c, true)).join('')}</div>`;
  }
  return h + '</div>';
}
function calloutRow(c, old) {
  return `<button class="item${old ? ' old' : ''}" data-a="itemEdit" data-list="callouts" data-id="${c.id}">
    <div class="grow"><b>${niceDate(c.date)}</b>${c.note ? `<div class="small pre">${esc(c.note)}</div>` : ''}</div>
    <span class="muted small">${old ? 'dropped' : 'drops'} ${niceDate(rollOff(c.date))}</span></button>`;
}

/* ---------- simple lists (call-outs, links, codes, memories) ---------- */
const LISTS = {
  callouts: { title: 'Call-out', required: 'date', fields: [['date', 'Date', 'date'], ['note', 'Notes (reason, who you called, time)', 'textarea']] },
  links: { title: 'Link', required: 'label', fields: [['label', 'Name', 'text'], ['url', 'Web address', 'url'], ['note', 'Note', 'textarea']] },
  codes: { title: 'Code', required: 'label', fields: [['label', 'What it\'s for', 'text'], ['code', 'Code', 'text'], ['note', 'Note', 'textarea']] },
  memories: { title: 'Memory', required: 'text', fields: [['date', 'Date', 'date'], ['text', 'Memory', 'textarea']] },
};
function openItemEditor(list, id) {
  const cfg = LISTS[list];
  const item = id === 'new' ? { date: today() } : state[list].find(x => x.id === id);
  const fields = cfg.fields.map(([k, label, type]) => type === 'textarea'
    ? `<label class="f">${label}<textarea id="f-${k}" rows="${list === 'memories' ? 8 : 4}">${esc(item[k])}</textarea></label>`
    : `<label class="f">${label}<input id="f-${k}" type="${type === 'url' ? 'url' : type}" value="${esc(item[k])}"${type === 'url' ? ' inputmode="url" autocapitalize="off" placeholder="https://"' : ''}></label>`).join('');
  openSheet(`<h3>${id === 'new' ? 'New' : 'Edit'} ${cfg.title.toLowerCase()}</h3>${fields}
    <div class="btn-row">${id === 'new' ? '' : `<button class="btn danger" data-a="itemDelete" data-list="${list}" data-id="${id}">Delete</button>`}
    <span style="flex:1"></span><button class="btn" data-a="closeSheet">Cancel</button>
    <button class="btn primary" data-a="itemSave" data-list="${list}" data-id="${id}">Save</button></div>`);
}

/* ---------- memories ---------- */
/* ---------- codes ---------- */
// Notes tab: codes as small tiles, then sticky notes that stay until you delete them
const NOTE_COLORS = { yellow: '#fff3a8', pink: '#ffd3e2', blue: '#cfe6ff', green: '#d4f2d2', orange: '#ffdcb5', purple: '#e6d8ff' };
function renderNotes() {
  const codes = state.codes.map(c => `<button class="code-tile" data-a="itemEdit" data-list="codes" data-id="${c.id}">
      <span class="small muted">${esc(c.label)}</span><span class="code">${esc(c.code)}</span></button>`).join('');
  const notes = state.notes.map(n => `<button class="sticky" data-nid="${n.id}" style="background:${NOTE_COLORS[n.color] || NOTE_COLORS.yellow}" data-a="noteEdit" data-id="${n.id}">
      <span class="pre">${esc(n.text)}</span><span class="sticky-date">${niceDate(n.date)}</span></button>`).join('');
  const hide = state.codesHidden;
  return `<div class="h-row"><button class="sec-toggle" data-a="codesToggle"><span>${hide ? '▸' : '▾'} Codes${hide && state.codes.length ? ` <span class="muted">(${state.codes.length})</span>` : ''}</span></button>
      ${hide ? '' : '<button class="plus-btn" data-a="itemEdit" data-list="codes" data-id="new" aria-label="Add code">+</button>'}</div>
    ${hide || !codes ? '' : `<div class="code-grid">${codes}</div>`}
    <div class="h-row" style="margin:22px 4px 8px"><h2 style="margin:0">Sticky notes</h2><button class="btn" data-a="noteEdit" data-id="new">＋ Note</button></div>
    ${notes ? `<div class="sticky-grid">${notes}</div>` : ''}`;
}
function renderNoteSheet() {
  const n = ui.noteDraft;
  openSheet(`<h3>${n.id === 'new' ? 'New note' : 'Sticky note'}</h3>
    <textarea id="note-text" rows="6" style="margin-top:10px;background:${NOTE_COLORS[n.color]};color:#231f20;border-color:transparent">${esc(n.text)}</textarea>
    <div class="swatches">${Object.entries(NOTE_COLORS).map(([k, v]) => `<button class="swatch${n.color === k ? ' on' : ''}" style="background:${v}" data-a="noteColor" data-c="${k}" aria-label="${k}"></button>`).join('')}</div>
    <div class="btn-row">${n.id === 'new' ? '' : `<button class="btn danger" data-a="noteDelete" data-id="${n.id}">Delete</button>`}
    <span style="flex:1"></span><button class="btn" data-a="closeSheet">Cancel</button>
    <button class="btn primary" data-a="noteSave">Save</button></div>`);
  const ta = $('#note-text'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

/* ---------- more ---------- */
function renderMore() {
  // Link tiles, 3 per row; the "i" shows that link's note (e.g. the Safari tip for Timpani)
  const links = state.links.map(l => `<div class="link-tile">
      ${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
              : `<a href="#" data-a="itemEdit" data-list="links" data-id="${l.id}">${esc(l.label)}<span class="muted small">add address</span></a>`}
      ${l.note ? `<button class="info-btn sm" data-a="linkInfo" data-id="${l.id}" aria-label="About ${esc(l.label)}">i</button>` : ''}</div>`).join('');
  return `<div class="h-row" style="margin:6px 4px 8px"><h2 style="margin:0">Links</h2>
      <button class="icon-btn" data-a="linksEdit" aria-label="Edit links">${PENCIL_SVG}</button></div>
    ${links ? `<div class="link-grid">${links}</div>` : '<p class="empty" style="margin:0 4px">No links yet. Tap the pencil to add one.</p>'}
    <h2>Call-outs</h2>${renderCallouts()}
    <button class="sec-toggle" style="margin-top:22px" data-a="backupToggle">${state.backupHidden ? '▸' : '▾'} Backup${state.backupHidden ? ` <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">· last ${state.lastBackup ? niceDate(state.lastBackup) : 'never'}</span>` : ''}</button>
    ${state.backupHidden ? '' : `<div class="card">
      <p class="small">Everything is saved on this phone only. Save a backup file now and then (to Files or iCloud Drive) so nothing is lost if you get a new phone.</p>
      <p class="small muted">Last backup: ${state.lastBackup ? niceDate(state.lastBackup) : 'never'}</p>
      <div class="grid2" style="margin-top:12px"><button class="btn primary" data-a="exportData">Save backup</button>
        <button class="btn" data-a="importData">Restore backup</button>
        <button class="btn danger" data-a="resetContent">Reset cards</button>
        <button class="btn" style="font-size:14px;padding:0 8px;white-space:nowrap" data-a="saveResetPoint">Save as reset point</button></div>
      <p class="muted small" style="margin-top:6px">Reset cards goes back to ${state.resetPoint ? 'your reset point from ' + niceDate(state.resetPoint.date) : 'the corrected built-in version'}. Save as reset point makes your current cards the new version to reset to.</p>
    </div>`}`;
}

async function exportData() {
  const name = 'ld-shift-backup-' + today() + '.json';
  const file = new File([JSON.stringify(state, null, 1)], name, { type: 'application/json' });
  const done = () => { state.lastBackup = today(); save(); if (ui.tab === 'more') render(); toast('Backup saved'); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); done(); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); done();
}
$('#import-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.protocols) || !Array.isArray(data.callouts)) throw new Error('bad');
      if (!confirm('Replace everything in the app with this backup?')) return;
      state = Object.assign(defaults(), data); save(); render(); toast('Backup restored');
    } catch (err) { toast('That file isn\'t a Bella\'s Book backup'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ---------- events ---------- */
/* ---------- press-and-hold to reorder to-dos ---------- */
const drag = { row: null, timer: null, startY: 0, y0: 0, on: false };
function dragCancel() { clearTimeout(drag.timer); drag.timer = null; if (!drag.on) drag.row = null; }
$('#sheet').addEventListener('pointerdown', e => {
  const row = e.target.closest('.todo-list .todo');
  if (!row || e.target.closest('.x')) return;
  drag.row = row; drag.startY = drag.y0 = e.clientY;
  drag.timer = setTimeout(() => {           // held still long enough → start dragging
    drag.on = true; row.classList.add('dragging');
    $('.sheet-card').classList.add('no-scroll');
    if (navigator.vibrate) navigator.vibrate(10);
  }, 300);
});
$('#sheet').addEventListener('pointermove', e => {
  if (!drag.row) return;
  if (!drag.on) { if (Math.abs(e.clientY - drag.y0) > 8) dragCancel(); return; } // moved first = scrolling
  e.preventDefault();
  const row = drag.row;
  row.style.transform = `translateY(${e.clientY - drag.startY}px)`;
  const prev = row.previousElementSibling, next = row.nextElementSibling, r = row.getBoundingClientRect();
  if (prev && e.clientY < prev.getBoundingClientRect().top + prev.offsetHeight / 2) {
    row.parentNode.insertBefore(row, prev); drag.startY -= prev.offsetHeight;
  } else if (next && e.clientY > next.getBoundingClientRect().top + next.offsetHeight / 2) {
    row.parentNode.insertBefore(next, row); drag.startY += next.offsetHeight;
  }
  row.style.transform = `translateY(${e.clientY - drag.startY}px)`;
});
$('#sheet').addEventListener('touchmove', e => { if (drag.on) e.preventDefault(); }, { passive: false });
function dragEnd() {
  if (!drag.on) { dragCancel(); return; }
  const list = drag.row.parentNode, p = curPt(list.dataset.p);
  const order = [...list.querySelectorAll('.todo')].map(el => el.dataset.tid);
  // Put the visible items in their new order; hidden (checked) ones keep their slots
  const visible = new Set(order), byId = Object.fromEntries(p.todos.map(t => [t.id, t])); let k = 0;
  p.todos = p.todos.map(t => visible.has(t.id) ? byId[order[k++]] : t);
  drag.on = false; drag.row = null; ui.suppressClick = true;
  save(); render(); renderTodoSheet();
  setTimeout(() => { ui.suppressClick = false; }, 400);
}
$('#sheet').addEventListener('pointerup', dragEnd);
$('#sheet').addEventListener('pointercancel', dragEnd);
$('#sheet').addEventListener('contextmenu', e => { if (e.target.closest('.todo-list')) e.preventDefault(); });

/* ---------- press-and-hold to reorder reference cards (within Meds or Other) ---------- */
const rd = { el: null, timer: null, y0: 0, startY: 0, on: false };
function rdCancel() { clearTimeout(rd.timer); rd.timer = null; if (!rd.on) rd.el = null; }
$('#main').addEventListener('pointerdown', e => {
  const el = e.target.closest('#reflist .ref');
  if (!el || ui.refQuery.trim() || e.target.closest('.ref-body, .btn-row')) return; // not while searching or inside an open card's text
  Object.assign(rd, { el, y0: e.clientY, startY: e.clientY });
  rd.timer = setTimeout(() => {
    rd.on = true; el.classList.add('dragging'); document.body.classList.add('no-scroll');
    if (navigator.vibrate) navigator.vibrate(10);
  }, 300);
});
$('#main').addEventListener('pointermove', e => {
  if (!rd.el) return;
  if (!rd.on) { if (Math.abs(e.clientY - rd.y0) > 8) rdCancel(); return; }
  e.preventDefault();
  const el = rd.el, prev = el.previousElementSibling, next = el.nextElementSibling;
  if (prev && e.clientY < prev.getBoundingClientRect().top + prev.offsetHeight / 2) {
    el.parentNode.insertBefore(el, prev); rd.startY -= prev.offsetHeight + 10;
  } else if (next && e.clientY > next.getBoundingClientRect().top + next.offsetHeight / 2) {
    el.parentNode.insertBefore(next, el); rd.startY += next.offsetHeight + 10;
  }
  el.style.transform = `translateY(${e.clientY - rd.startY}px)`;
});
document.addEventListener('touchmove', e => { if (rd.on) e.preventDefault(); }, { passive: false });
function rdEnd() {
  document.body.classList.remove('no-scroll');
  if (!rd.on) { rdCancel(); return; }
  // New order for this section; cards in the other section keep their places
  const order = [...rd.el.parentNode.querySelectorAll('.ref')].map(x => x.dataset.rid);
  const inSec = new Set(order), byId = Object.fromEntries(state.refs.map(r => [r.id, r])); let k = 0;
  state.refs = state.refs.map(r => inSec.has(r.id) ? byId[order[k++]] : r);
  rd.on = false; rd.el = null; ui.suppressClick = true;
  save(); renderRefList();
  setTimeout(() => { ui.suppressClick = false; }, 400);
}
$('#main').addEventListener('pointerup', rdEnd);
$('#main').addEventListener('pointercancel', rdEnd);

/* ---------- press-and-hold to rearrange sticky notes (2-column grid) ---------- */
const nd = { el: null, timer: null, x0: 0, y0: 0, on: false };
function ndCancel() { clearTimeout(nd.timer); nd.timer = null; if (!nd.on) nd.el = null; }
$('#main').addEventListener('pointerdown', e => {
  const el = e.target.closest('.sticky-grid .sticky');
  if (!el) return;
  Object.assign(nd, { el, x0: e.clientX, y0: e.clientY });
  nd.timer = setTimeout(() => {
    nd.on = true; el.classList.add('dragging'); document.body.classList.add('no-scroll');
    if (navigator.vibrate) navigator.vibrate(10);
  }, 300);
});
$('#main').addEventListener('pointermove', e => {
  if (!nd.el) return;
  if (!nd.on) { if (Math.hypot(e.clientX - nd.x0, e.clientY - nd.y0) > 8) ndCancel(); return; }
  e.preventDefault();
  const el = nd.el;
  el.style.transform = `translate(${e.clientX - nd.x0}px, ${e.clientY - nd.y0}px)`;
  el.style.pointerEvents = 'none';
  const over = document.elementFromPoint(e.clientX, e.clientY);
  el.style.pointerEvents = '';
  const target = over && over.closest('.sticky-grid .sticky');
  if (target && target !== el) {
    const r0 = el.getBoundingClientRect();
    const items = [...el.parentNode.children], from = items.indexOf(el), to = items.indexOf(target);
    el.parentNode.insertBefore(el, from < to ? target.nextSibling : target);
    const r1 = el.getBoundingClientRect(); // keep it under the finger after the swap
    nd.x0 += r1.left - r0.left; nd.y0 += r1.top - r0.top;
    el.style.transform = `translate(${e.clientX - nd.x0}px, ${e.clientY - nd.y0}px)`;
  }
});
document.addEventListener('touchmove', e => { if (nd.on) e.preventDefault(); }, { passive: false });
function ndEnd() {
  document.body.classList.remove('no-scroll');
  if (!nd.on) { ndCancel(); return; }
  const order = [...nd.el.parentNode.children].map(x => x.dataset.nid);
  state.notes.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  nd.on = false; nd.el = null; ui.suppressClick = true;
  save(); render();
  setTimeout(() => { ui.suppressClick = false; }, 400);
}
$('#main').addEventListener('pointerup', ndEnd);
$('#main').addEventListener('pointercancel', ndEnd);
$('#main').addEventListener('contextmenu', e => { if (e.target.closest('.sticky-grid')) e.preventDefault(); });

document.addEventListener('click', e => {
  if (ui.suppressClick) { ui.suppressClick = false; e.stopPropagation(); e.preventDefault(); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  if (b.tagName === 'A') e.preventDefault();
  const fn = actions[b.dataset.a]; if (fn) fn(b.dataset, b, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-f="kind"]') && ui.draft) { readDraft(); renderProtoEditor(); return; }
  if (t.dataset.sdKind) { ui.startDraft.pts[+t.dataset.sdKind].kind = t.value; return; }
  if (t.dataset.remind) { const g = curPt(ui.rowEdit.p).tags.find(x => x.id === t.dataset.remind); g.remind = +t.value || 0; save(); render(); return; }
  if (t.dataset.sdTime) { ui.startDraft[t.dataset.sdTime] = +t.value; return; }
  if (t.dataset.def) {
    const ds = state.defaultShift = state.defaultShift || { type: 'day', start: DEFAULT_HOURS.day[0], end: DEFAULT_HOURS.day[1] };
    ds[t.dataset.def] = +t.value; ui.startDraft = null; save(); render(); return;
  }
  if (t.dataset.smTime) { ui.shiftDraft[t.dataset.smTime] = +t.value; return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ref-q') { ui.refQuery = t.value; renderRefList(); }
  else if (t.dataset.sdRoom) ui.startDraft.pts[+t.dataset.sdRoom].room = t.value;
  else if (t.dataset.ptnotes) { curPt(t.dataset.ptnotes).notes = t.value; saveSoon(); }
  else if (t.dataset.qbl) { qblData(qblOwner())[t.dataset.qbl] = t.value; updateQblTotals(); saveSoon(); }
  else if (t.dataset.qr) { qblData(qblOwner()).rows[+t.dataset.qr].g = t.value; updateQblTotals(); saveSoon(); }
  else if (t.dataset.qj) {
    qblData(qblOwner()).rows[+t.dataset.qi].items[+t.dataset.qj][t.dataset.qf] = t.value; saveSoon();
    if (t.dataset.qf === 'name') renderQblSheet(); else updateQblTotals();
  }
  else if (t.dataset.to) { curPt(ui.timeoutSheet).timeout[t.dataset.to] = t.value; saveSoon(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'todo-new') { e.preventDefault(); actions.todoAdd({ p: e.target.dataset.p }); }
  else if (e.target.id === 'row-new') { e.preventDefault(); actions.rowAdd({}); }
});
window.addEventListener('pagehide', save);

// Hospital max is 18 hrs, so a shift resets on its own after that (with a chance to cancel)
const SHIFT_MAX = 18 * 3600e3;
function checkShiftReset() {
  const sh = state.shift;
  if (!sh || document.hidden || ui.resetTimer) return;
  if (Date.now() - sh.startedAt < SHIFT_MAX || (sh.keepUntil && Date.now() < sh.keepUntil)) return;
  let left = 30;
  openSheet(`<h3>Resetting your shift</h3>
    <p class="small" style="margin-top:6px">It's been 18 hrs since this shift started, so everything from it will clear in <b id="reset-left">${left}</b> seconds.</p>
    <div class="btn-row end"><button class="btn" data-a="keepShift">Keep my shift</button>
    <button class="btn primary" data-a="resetNow">Reset now</button></div>`);
  ui.resetTimer = setInterval(() => {
    left--; const el = $('#reset-left'); if (el) el.textContent = left;
    if (left <= 0) actions.resetNow();
  }, 1000);
}
function keepShift() {
  clearInterval(ui.resetTimer); ui.resetTimer = null;
  if (state.shift) { state.shift.keepUntil = Date.now() + 3600e3; save(); } // ask again in an hour
}
actions.keepShift = () => { keepShift(); closeSheet(); };
actions.resetNow = () => {
  clearInterval(ui.resetTimer); ui.resetTimer = null;
  state.shift = null; state.runs = state.runs.filter(r => !(r.ptId && r.finishedAt)); ui.startDraft = null; save(); closeSheet(); render(); toast('New shift — last shift cleared');
};

// Refresh "due" highlights while a protocol is running
setInterval(() => {
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!$('#sheet').hidden || typing) return;
  // Only the live pages redraw; elsewhere just refresh the Running badge so nothing jumps while you read
  if ((ui.tab === 'running' && state.runs.length) || (ui.tab === 'shift' && state.shift)) render();
  else updateRunBadge();
}, 30000);
setInterval(checkShiftReset, 30000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (ui.tab === 'running' || ui.tab === 'shift') && $('#sheet').hidden && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
  else if (!document.hidden) updateRunBadge();
  checkShiftReset();
});

load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
// Offline copy (sw.js next to this file) so the app opens with no internet
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
checkShiftReset();
</script>
